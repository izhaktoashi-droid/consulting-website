<style>

:root {
--navy:#0b2239;
--navy2:#163a5c;
--orange:#e8710a;
--orange-dark:#c85f05;
--gold:#e8c98a;
--ink:#1c2a38;
--muted:#566b80;
--bg:#f4f7fa;
--line:#dde6ee;
--green:#1fa855;
}

* {
box-sizing:border-box;
margin:0;
padding:0;
}

html {
scroll-behavior:smooth;
scroll-padding-top:86px;
}

body {
font-family:"Heebo",Arial,sans-serif;
color:var(--ink);
line-height:1.75;
background:#fff;
overflow-x:hidden;
}

a {
color:inherit;
text-decoration:none;
}

button,input,select,textarea {
font:inherit;
}

img {
max-width:100%;
display:block;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
outline:3px solid var(--orange);
outline-offset:3px;
}

.container {
width:min(1160px,92%);
margin:auto;
}

/* HEADER */

header {
position:sticky;
top:0;
z-index:1000;
background:rgba(255,255,255,.98);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--line);
box-shadow:0 5px 22px rgba(11,34,57,.08);
}

.nav {
min-height:94px;
display:flex;
align-items:center;
justify-content:space-between;
gap:16px;
}

.logo img {
height:76px;
width:auto;
max-width:280px;
object-fit:contain;
mix-blend-mode:multiply;
}

.nav-right {
display:flex;
align-items:center;
gap:16px;
}

.contact-icons {
display:flex;
align-items:center;
gap:10px;
}

.contact-icon {
width:46px;
height:46px;
display:inline-flex;
align-items:center;
justify-content:center;
border-radius:50%;
color:#fff;
transition:.2s;
box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.contact-icon svg {
width:23px;
height:23px;
fill:currentColor;
}

.contact-icon:hover {
transform:translateY(-3px);
box-shadow:0 7px 16px rgba(0,0,0,.18);
}

.contact-icon.whatsapp {background:#1fa855}
.contact-icon.email {background:var(--navy)}
.contact-icon:focus-visible {outline:3px solid var(--orange);outline-offset:3px}

.nav-links {
display:flex;
align-items:center;
gap:20px;
list-style:none;
}

.nav-links a:not(.btn) {
font-size:15px;
font-weight:600;
color:#3d5266;
padding:6px 0;
border-bottom:2px solid transparent;
}

.nav-links a:not(.btn):hover {
border-color:var(--orange);
color:var(--navy);
}

.lang-btn {
background:#fff;
border:1px solid var(--navy);
color:var(--navy);
border-radius:30px;
padding:9px 17px;
font-weight:800;
cursor:pointer;
transition:.2s;
white-space:nowrap;
}

.lang-btn:hover {
background:var(--navy);
color:#fff;
}

.menu-btn {
display:none;
background:#fff;
border:1px solid var(--line);
border-radius:10px;
width:44px;
height:44px;
cursor:pointer;
color:var(--navy);
font-size:23px;
}

/* BUTTONS */

.btn {
display:inline-flex;
align-items:center;
justify-content:center;
padding:14px 26px;
border-radius:50px;
font-weight:700;
font-size:15px;
border:1px solid transparent;
transition:.25s;
cursor:pointer;
text-align:center;
}

.btn-primary {
background:var(--orange);
color:#fff;
}

.btn-primary:hover {
background:var(--orange-dark);
transform:translateY(-2px);
}

.btn-wa {
background:var(--green);
color:#fff;
}

.btn-wa:hover {
background:#188a46;
}

.btn-ghost {
border-color:rgba(255,255,255,.5);
color:#fff;
}

.btn-ghost:hover {
background:#fff;
color:var(--navy);
}

/* HERO */

.brand-intro {
background:#f4f7fa;
padding:38px 0 30px;
text-align:center;
border-bottom:1px solid var(--line);
}

.brand-intro h1 {
color:var(--navy);
font-size:clamp(30px,4vw,46px);
line-height:1.2;
font-weight:800;
margin-bottom:10px;
}

.brand-intro .brand-tagline {
color:var(--orange-dark);
font-size:clamp(21px,2.7vw,30px);
font-weight:800;
line-height:1.35;
margin-bottom:12px;
}

.brand-intro p {
max-width:920px;
margin:0 auto;
color:var(--muted);
font-size:18px;
}

.hero {
background:
radial-gradient(circle at 85% 20%,rgba(45,112,148,.3),transparent 40%),
linear-gradient(135deg,#071a2d,var(--navy2) 70%,#1b5a7d);
color:#fff;
padding:62px 0;
}

.hero-grid {
display:grid;
grid-template-columns:1.1fr .9fr;
gap:55px;
align-items:center;
}

.hero h1,
.hero h2 {
font-size:clamp(32px,4vw,48px);
line-height:1.2;
font-weight:800;
letter-spacing:-.7px;
margin-bottom:24px;
}

.hero h1 em {
font-style:normal;
color:var(--gold);
}

.hero-subtitle {
font-size:23px;
font-weight:700;
color:#fff;
margin-bottom:16px;
line-height:1.45;
}

.lead {
font-size:18px;
color:#d6e4ef;
margin-bottom:22px;
max-width:650px;
}

.hero-benefits {
list-style:none;
display:grid;
gap:10px;
margin:25px 0 32px;
}

.hero-benefits li {
position:relative;
padding-inline-start:28px;
color:#edf4fa;
}

.hero-benefits li:before {
content:"✓";
position:absolute;
inset-inline-start:0;
color:var(--gold);
font-weight:800;
}

.actions {
display:flex;
flex-wrap:wrap;
gap:12px;
}

.hero-img {
border-radius:22px;
padding:9px;
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.2);
box-shadow:0 30px 70px rgba(0,0,0,.35);
}

.hero-img img {
width:100%;
aspect-ratio:16/10;
object-fit:cover;
border-radius:15px;
}

/* TRUST STRIP */

.trust {
background:#fff;
padding:28px 0;
border-bottom:1px solid var(--line);
}

.trust-grid {
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
text-align:center;
}

.trust-item strong {
display:block;
color:var(--navy);
font-size:17px;
}

.trust-item span {
color:var(--muted);
font-size:14px;
}

/* SECTIONS */

section {
padding:82px 0;
}

.alt {
background:var(--bg);
}

.section-head {
max-width:780px;
margin:0 auto 48px;
text-align:center;
}

h2 {
font-size:clamp(28px,3.3vw,39px);
line-height:1.25;
color:var(--navy);
font-weight:800;
margin-bottom:14px;
}

.section-sub {
color:var(--muted);
font-size:18px;
}

h3 {
color:var(--navy);
font-size:21px;
line-height:1.35;
margin-bottom:12px;
}

/* SERVICE CARDS */

.grid {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
gap:22px;
}

.card {
background:#fff;
border:1px solid var(--line);
border-radius:16px;
padding:30px 27px;
transition:.3s;
}

.card:hover {
transform:translateY(-5px);
box-shadow:0 18px 44px rgba(11,34,57,.09);
}

.card-icon {
width:48px;
height:48px;
display:flex;
align-items:center;
justify-content:center;
background:#fff1e4;
border-radius:12px;
font-size:25px;
margin-bottom:18px;
}

.card p {
color:var(--muted);
font-size:15.5px;
}

/* HOW IT WORKS */

.steps {
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
list-style:none;
counter-reset:steps;
}

.steps li {
counter-increment:steps;
border-inline-start:3px solid var(--orange);
padding-inline-start:20px;
}

.steps li:before {
content:counter(steps);
display:block;
font-size:35px;
font-weight:800;
color:var(--orange);
line-height:1;
margin-bottom:12px;
}

.steps p {
color:var(--muted);
font-size:15px;
}

/* BENEFITS */

.benefit {
display:flex;
align-items:flex-start;
gap:18px;
padding:24px;
background:#fff;
border-radius:14px;
border:1px solid var(--line);
}

.benefit-icon {
font-size:27px;
}

.benefit p {
color:var(--muted);
font-size:15px;
}

/* SERVICE MODEL */

.service-model {
background:#fff8f0;
border-top:1px solid #f5dfca;
border-bottom:1px solid #f5dfca;
}

.model-grid {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.model-item {
background:#fff;
border:1px solid #f0dfcf;
border-radius:15px;
padding:24px;
text-align:center;
}

.model-item strong {
display:block;
color:var(--navy);
font-size:19px;
margin-bottom:8px;
}

.model-item p {
color:var(--muted);
font-size:15px;
}

.security-note {
margin-top:24px;
padding:20px 24px;
background:#edf7f2;
border:1px solid #cce8d8;
border-radius:14px;
color:#214d37;
font-weight:600;
text-align:center;
}

/* REPORTING */

.reporting {
background:linear-gradient(120deg,#0b2239,#163a5c);
color:#fff;
}

.reporting h2 {
color:#fff;
}

.reporting .section-sub {
color:#d6e4ef;
}

.reporting-grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.reporting-content p {
color:#d6e4ef;
margin-bottom:18px;
font-size:17px;
}

.reporting-list {
list-style:none;
display:grid;
gap:12px;
}

.reporting-list li {
padding-inline-start:28px;
position:relative;
}

.reporting-list li:before {
content:"✓";
position:absolute;
inset-inline-start:0;
color:var(--gold);
font-weight:800;
}

.report-box {
background:#fff;
color:var(--navy);
border-radius:18px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.report-box h3 {
margin-bottom:20px;
}

.report-row {
display:flex;
justify-content:space-between;
gap:15px;
padding:14px 0;
border-bottom:1px solid var(--line);
font-size:14px;
}

.report-row strong {
color:#17865b;
}

/* FAQ */

.faq {
max-width:850px;
margin:auto;
}

details {
border:1px solid var(--line);
border-radius:13px;
background:#fff;
margin-bottom:12px;
}

summary {
cursor:pointer;
padding:19px 22px;
font-weight:700;
font-size:17px;
color:var(--navy);
list-style:none;
display:flex;
justify-content:space-between;
gap:15px;
}

summary::-webkit-details-marker {
display:none;
}

summary:after {
content:"+";
font-size:23px;
color:var(--orange);
}

details[open] summary:after {
content:"−";
}

details p {
padding:0 22px 20px;
color:var(--muted);
}

/* CONTACT */

.form {
max-width:720px;
margin:auto;
background:#fff;
border:1px solid var(--line);
border-radius:20px;
padding:38px;
box-shadow:0 18px 44px rgba(11,34,57,.09);
}

.form-grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.field {
margin-bottom:17px;
}

label {
display:block;
font-size:14px;
font-weight:700;
color:var(--navy);
margin-bottom:6px;
}

input,select,textarea {
width:100%;
padding:13px 15px;
border:1px solid #cbd8e5;
border-radius:10px;
background:#fafcff;
}

textarea {
min-height:115px;
resize:vertical;
}

input:focus,select:focus,textarea:focus {
border-color:#0b857a;
box-shadow:0 0 0 4px rgba(11,133,122,.12);
outline:none;
}

.form .btn {
width:100%;
background:var(--navy);
color:#fff;
padding:16px;
}

.form .btn:hover {
background:var(--orange);
}

.note {
font-size:13px;
color:var(--muted);
margin-top:12px;
text-align:center;
}

.alt-contact {
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-top:24px;
}

/* FOOTER */

footer {
background:#061523;
color:#b8c8d6;
padding:42px 0 90px;
text-align:center;
font-size:14px;
}

footer p {
margin-top:9px;
}

footer a {
color:#ffb366;
}

.flogo {
display:inline-block;
background:#fff;
padding:8px 20px;
border-radius:12px;
margin-bottom:12px;
}

.flogo img {
height:42px;
width:auto;
}

/* MOBILE CTA */

.mobile-cta {display:none !important;}

/* RESPONSIVE */

@media(max-width:1050px) {

.hero-grid {
grid-template-columns:1fr;
gap:35px;
}

.report-grid,
.reporting-grid {
grid-template-columns:1fr;
}

.nav {
min-height:86px;
}

.logo img {
height:70px;
}

.nav-right {
gap:10px;
}

.menu-btn {
display:grid;
place-items:center;
}

.nav-links {
display:none;
position:absolute;
top:86px;
inset-inline:0;
background:#fff;
flex-direction:column;
align-items:stretch;
gap:0;
padding:15px 4%;
border-bottom:1px solid var(--line);
}

.nav-links.open {
display:flex;
}

.nav-links li {
padding:10px 0;
border-bottom:1px solid var(--bg);
}

.nav-links li:last-child {
border:0;
}

.steps {
grid-template-columns:1fr 1fr;
}
}

@media(max-width:800px) {
.model-grid {grid-template-columns:1fr}
}

@media(max-width:650px) {

.container {
width:92%;
}

.nav {
min-height:72px;
gap:6px;
}

.logo img {
height:58px;
max-width:40vw;
}

.nav-links {
top:72px;
}

.nav-right {
gap:6px;
}

.contact-icons {
gap:6px;
}

.contact-icon {
width:38px;
height:38px;
}

.contact-icon svg {
width:19px;
height:19px;
}

.lang-btn {
padding:7px 9px;
font-size:12px;
}

.hero {
padding:58px 0;
}

.hero h1,
.hero h2 {
font-size:36px;
}

.hero-subtitle {
font-size:20px;
}

.lead {
font-size:16px;
}

section {
padding:60px 0;
}

.steps {
grid-template-columns:1fr;
}

.trust-grid {
grid-template-columns:1fr 1fr;
gap:22px;
}

.form-grid {
grid-template-columns:1fr;
gap:0;
}

.form {
padding:25px 18px;
}

.actions .btn {
width:100%;
}

.mobile-cta {
display:flex;
}

footer {
padding-bottom:42px;
}
}

@media(prefers-reduced-motion:reduce) {
* {
transition:none!important;
scroll-behavior:auto!important;
}
}

</style>
