let currentLanguage = "he";

function setLanguage(lang) {

if (!translations[lang]) return;

currentLanguage = lang;

const t = translations[lang];

document.documentElement.lang = lang;
document.documentElement.dir = lang === "he" ? "rtl" : "ltr";

document.title = t.title;

document.querySelector('meta[name="description"]').content = t.description;

document.querySelector('meta[property="og:locale"]').content =
lang === "he" ? "he_IL" : "en_US";

document.getElementById("languageBtn").textContent =
lang === "he" ? "EN" : "עברית";

document.getElementById("menuBtn").setAttribute(
"aria-label",
lang === "he" ? "תפריט" : "Menu"
);

document.querySelectorAll("[data-i18n]").forEach(element => {

const key = element.dataset.i18n;

if (t[key] !== undefined) {
element.textContent = t[key];
}

});

document.querySelectorAll("[data-i18n-html]").forEach(element => {

const key = element.dataset.i18nHtml;

if (t[key] !== undefined) {
element.innerHTML = t[key];
}

});

document.getElementById("mailSubject").value =
lang === "he"
? "פנייה חדשה מאתר Mogatek"
: "New inquiry from Mogatek website";

try {
localStorage.setItem("mogatek-language",lang);
} catch(e) {}

}

function toggleLanguage() {

setLanguage(currentLanguage === "he" ? "en" : "he");

}

/* CONTACT FORM */

document.querySelector(".form").addEventListener("submit",function(e) {

const email = document.getElementById("email").value.trim();

document.getElementById("replyTo").value = email;

});

/* NAVIGATION */

const menu = document.getElementById("menu");
const menuButton = document.getElementById("menuBtn");

menuButton.addEventListener("click",()=>{

const opened = menu.classList.toggle("open");

menuButton.setAttribute("aria-expanded",opened);

});

menu.addEventListener("click",e=>{

if(e.target.closest("a")) {

menu.classList.remove("open");

menuButton.setAttribute("aria-expanded","false");

}

});

/* YEAR */

document.getElementById("year").textContent =
new Date().getFullYear();

/* INITIAL LANGUAGE */

let savedLanguage = "he";

try {
const saved = localStorage.getItem("mogatek-language");
if (saved === "en" || saved === "he") savedLanguage = saved;
} catch(e) {}

setLanguage(savedLanguage);

</script>
